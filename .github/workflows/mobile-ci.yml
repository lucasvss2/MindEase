name: Mobile CI - Mind Ease

on:
  push:
    branches: ["main"]
    paths:
      - "mind-ease-mobile/**"
  pull_request:
    branches: ["main"]
    paths:
      - "mind-ease-mobile/**"

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./mind-ease-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "./mind-ease-mobile/package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Run Tests
        run: npm test -- --watchAll=false --ci

